#version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_container
    mem_limit: 200m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bdd/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - crypto_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: redis_container
    mem_limit: 64m
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - crypto_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  worker:
    image: registry.gitlab.com/argau13/crypto-rag-project/worker:latest
    container_name: crypto_worker
    mem_limit: 128m
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - crypto_network
    depends_on:
      - redis
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scraper:
    image: registry.gitlab.com/argau13/crypto-rag-project/scraper:latest
    container_name: crypto_scraper
    mem_limit: 300m
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    networks:
      - crypto_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: registry.gitlab.com/argau13/crypto-rag-project/api:latest
    container_name: crypto_api
    mem_limit: 256m
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - crypto_network
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  report_generator:
    image: registry.gitlab.com/argau13/crypto-rag-project/report_generator:latest
    container_name: report_generator
    mem_limit: 300m
    env_file:
      - .env
    networks:
      - crypto_network
    depends_on:
      - postgres
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: registry.gitlab.com/argau13/crypto-rag-project/frontend:latest
    container_name: crypto_frontend
    mem_limit: 64m
    networks:
      - crypto_network
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  nginx:
    image: nginx:alpine
    container_name: crypto_nginx
    mem_limit: 32m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - crypto_network
    depends_on:
      - frontend
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:

networks:
  crypto_network:
    driver: bridge
